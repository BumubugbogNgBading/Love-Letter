<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 🌷</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating tulips -->
    <div class="flower flower1">🌷</div>
    <div class="flower flower2">🌷</div>
    <div class="flower flower3">🌷</div>
    <div class="flower flower4">🌷</div>

    <!-- Main card -->
    <div class="card">

        <div class="tulips">
            🌷 🌷 🌷
        </div>

        <h1>For You ❤️</h1>

        <p class="message">
            Just like tulips bloom beautifully,<br>
            I hope your days are always filled<br>
            with love, happiness, and beautiful moments.
            <br><br>
            You deserve all the little things<br>
            that make your heart smile. 🌷
        </p>

        <div class="heart">♥</div>

        <p class="signature">
            With love, always.
        </p>

    </div>

</body>
</html>
